name: cargoorbit
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: cargoorbit
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d cargoorbit']
      interval: 5s
      timeout: 5s
      retries: 20
  clamav:
    image: clamav/clamav:stable
    ports:
      - '127.0.0.1:3310:3310'
    volumes:
      - clamdata:/var/lib/clamav
    profiles: ['scanner']
volumes:
  pgdata:
  clamdata:
